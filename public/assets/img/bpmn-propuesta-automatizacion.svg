<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 730" role="img" aria-labelledby="title desc"><title id="title">Propuesta de automatización: lectura de documentos y registro en una base de datos profesional en la nube</title><desc id="desc">El sistema lee los documentos, identifica su tipo y revisa sus datos. Una persona resuelve las dudas antes de guardar un nuevo registro en una base de datos profesional en la nube.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#66737C"/></marker></defs><rect x="1" y="1" width="458" height="728" rx="3" fill="#FFFFFF" stroke="#DAD6CD"/><path d="M36 1V729" stroke="#DAD6CD"/><text x="20" y="380" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#14202A"><tspan x="20" dy="0"></tspan></text><text transform="translate(23 535) rotate(-90)" font-family="Arial,sans-serif" font-size="13" fill="#46515A">Equipo administrativo + automatización</text><circle cx="215" cy="56" r="17" fill="white" stroke="#66737C" stroke-width="2"/><text x="215" y="22" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#14202A"><tspan x="215" dy="0">Documentos recibidos</tspan></text><path d="M215 73V96" fill="none" stroke="#66737C" stroke-width="2" marker-end="url(#arrow)"/><rect x="105" y="96" width="220" height="64" rx="10" fill="#F4F1EA" stroke="#6A747B" stroke-width="2"/><g stroke="#66737C" fill="none" stroke-width="1.5"><circle cx="120" cy="108" r="3"/><path d="M115 119v-4q5-7 10 0v4M120 112v10"/></g><text x="215" y="123" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#14202A"><tspan x="215" dy="0">Recibir y reunir</tspan><tspan x="215" dy="20">los documentos</tspan></text><path d="M215 160V186" fill="none" stroke="#66737C" stroke-width="2" marker-end="url(#arrow)"/><rect x="105" y="186" width="220" height="64" rx="10" fill="#DCF2E8" stroke="#0C6B4F" stroke-width="2"/><g transform="translate(110 190) scale(0.75)" fill="none" stroke="#0C6B4F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></g><text x="215" y="213" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#14202A"><tspan x="215" dy="0">Leer el documento</tspan><tspan x="215" dy="20">y reconocer sus datos</tspan></text><path d="M215 250V276" fill="none" stroke="#66737C" stroke-width="2" marker-end="url(#arrow)"/><rect x="105" y="276" width="220" height="64" rx="10" fill="#DCF2E8" stroke="#0C6B4F" stroke-width="2"/><g transform="translate(110 280) scale(0.75)" fill="none" stroke="#0C6B4F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></g><text x="215" y="303" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#14202A"><tspan x="215" dy="0">Identificar el documento</tspan><tspan x="215" dy="20">Factura · guía · nota de crédito</tspan></text><path d="M215 340V366" fill="none" stroke="#66737C" stroke-width="2" marker-end="url(#arrow)"/><rect x="105" y="366" width="220" height="64" rx="10" fill="#DCF2E8" stroke="#0C6B4F" stroke-width="2"/><g transform="translate(110 370) scale(0.75)" fill="none" stroke="#0C6B4F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></g><text x="215" y="393" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#14202A"><tspan x="215" dy="0">Revisar los datos</tspan><tspan x="215" dy="20">y evitar registros repetidos</tspan></text><path d="M215 4