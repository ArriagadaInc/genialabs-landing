<!DOCTYPE html>
<html lang="es-CL" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página no encontrada | Genia Labs</title>
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#14202A" />
  <link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png" />
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png" />
  <link rel="stylesheet" href="/assets/css/styles.css" />
</head>
<body class="bg-papel-100 text-tinta font-sans">
  <header class="en-tinta bg-tinta border-b border-white/10">
    <div class="max-w-pagina mx-auto px-5 sm:px-6 lg:px-8 h-[84px] flex items-center justify-between">
      <a href="/" class="marca rounded p-1 -ml-1" aria-label="Genia Labs, inicio">
        <img src="/assets/img/logo-genialabs.svg" alt="" width="44" height="53" class="marca-simbolo" />
        <span class="marca-texto" aria-hidden="true">
          <span class="marca-genia">GENIA</span>
          <span class="marca-labs">LABS</span>
        </span>
      </a>
      <a href="/" class="rotulo rotulo-claro hover:text-papel inline-flex items-center gap-1.5">
        <i data-lucide="arrow-left" class="w-3.5 h-3.5" aria-hidden="true"></i> Volver al inicio
      </a>
    </div>
  </header>
  <main class="min-h-[calc(100vh-85px)] flex items-center justify-center px-5 py-16">
    <div class="ficha w-full max-w-lg">
      <div class="ficha-cab">
        <p class="rotulo">Dirección solicitada</p>
        <span class="estado estado-espera">No existe</span>
      </div>
      <div class="ficha-cuerpo sm:!p-9">
        <p class="display-ancho text-tinta-500 text-[1.3rem] mb-1">Error 404</p>
        <h1 class="display text-[2.2rem] sm:text-[2.6rem] mb-4">Aquí no hay nada.</h1>
        <p class="text-tinta-700 leading-relaxed">
          El enlace puede haber cambiado o la dirección puede estar mal escrita. Desde el inicio llegas a todo el
          sitio.
        </p>
        <a href="/" class="boton mt-8">
          <i data-lucide="arrow-left" class="w-4 h-4" aria-hidden="true"></i>
          Volver al inicio
        </a>
      </div>
    </div>
  </main>
</body>
</html>
